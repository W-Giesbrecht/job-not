<mat-card class="time-entry-card">
  <mat-card-header>
    <mat-card-title>Zeiterfassung</mat-card-title>
    <mat-card-subtitle>Trage hier deine Schichtzeiten ein</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="timeForm" (ngSubmit)="onSubmit()" class="time-form">
      <!-- Datum -->
      <mat-form-field appearance="outline">
        <mat-label>Datum</mat-label>
        <input matInput type="date" formControlName="date" />
      </mat-form-field>

      <div class="time-row">
        <!-- Startzeit -->
        <mat-form-field appearance="outline">
          <mat-label>Arbeitsbeginn</mat-label>
          <input matInput type="time" formControlName="startTime" />
        </mat-form-field>

        <!-- Endzeit -->
        <mat-form-field appearance="outline">
          <mat-label>Arbeitsende</mat-label>
          <input matInput type="time" formControlName="endTime" />
        </mat-form-field>
      </div>

      <!-- Pause in Minuten -->
      <mat-form-field appearance="outline">
        <mat-label>Pause (Minuten)</mat-label>
        <input matInput type="number" formControlName="breakMinutes" min="0" />
        <mat-hint>Wird anhand der Arbeitszeit automatisch berechnet</mat-hint>
      </mat-form-field>

      <!-- Notizen -->
      <mat-form-field appearance="outline">
        <mat-label>Notizen / Einsatzort</mat-label>
        <textarea
          matInput
          formControlName="notes"
          rows="3"
          placeholder="z. B. Baustelle A45, Schicht 1"
        ></textarea>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="timeForm.invalid">
        <mat-icon>save</mat-icon>
        Schicht Speichern
      </button>
    </form>
  </mat-card-content>
</mat-card>
