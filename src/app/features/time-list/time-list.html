<div class="time-list-container">
  <h2>Meine erfassten Schichten</h2>

  <!-- Nachricht, wenn noch keine Einträge vorhanden sind -->
  <p *ngIf="records().length === 0" class="no-records">
    Noch keine Schichten eingetragen. Nutze das Formular oben, um deine Arbeitszeit zu speichern.
  </p>

  <!-- Liste der Schichten -->
  <mat-card *ngFor="let record of records()" class="record-card">
    <mat-card-header>
      <mat-icon mat-card-avatar color="primary">schedule</mat-icon>
      <mat-card-title>{{ record.date | date:'dd.MM.yyyy' }}</mat-card-title>
      <mat-card-subtitle>
        {{ record.startTime }} Uhr - {{ record.endTime }} Uhr
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="details-row">
        <mat-chip-option selectable="false" color="accent" selected>
          Pause: {{ record.breakMinutes }} Min
        </mat-chip-option>

        <p *ngIf="record.notes" class="notes">
          <strong>Notiz:</strong> {{ record.notes }}
        </p>
      </div>
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-icon-button color="warn" (click)="deleteRecord(record.id)" title="Eintrag löschen">
        <mat-icon>delete</mat-icon>
      </button>
    </mat-card-actions>
  </mat-card>
</div>
